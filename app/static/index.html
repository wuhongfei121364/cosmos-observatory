<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宇宙万物观测站</title>
<style>
:root{
  --paper:#F3F4F6; --surface:#FFFFFF; --ink:#141922; --ink2:#4A5263; --ink3:#7A8293;
  --rule:#E2E5EA; --rule2:#CDD2D9; --hover:#F0F3F7; --accent:#1C5CAB; --accent-soft:#E6EEF8;
  --good:#1E7A46; --good-soft:#E7F3EC;
  --plate:#0E2236; --plate-ink:#D8E4F0;
  /* categorical slots, fixed order (validated reference palette, light / dark) */
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c-other:#A6ADB8;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- top line ---------- */
.top{display:flex;align-items:center;gap:24px;padding:0 32px;height:58px;background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.nav{display:flex;gap:4px;height:100%}
.nav a{display:flex;align-items:center;padding:0 14px;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent;font-size:14px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.page:not(.on){display:none!important}
.top h1{font:700 21px/1 var(--serif);margin:0;letter-spacing:.04em}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.dot.err{background:#B3261E}
.top .run{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.top select{border:1px solid var(--rule2);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:240px;color:var(--ink)}

/* ---------- 总览 page: one screen ---------- */
.home{height:calc(100vh - 58px);min-height:620px;padding:28px 32px 32px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:24px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;min-height:0;min-width:0;display:flex;flex-direction:column}
.card h2{font:600 16px/1.3 var(--serif);margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card h2 span{font:400 12px var(--sans);color:var(--ink3)}
.hero{grid-column:1/-1;display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap;padding:6px 2px 0}
.headline .lbl{font-size:13px;color:var(--ink3);margin-bottom:4px}
.big{font:600 56px/1 var(--sans);letter-spacing:-.02em}
.headline .say{color:var(--ink2);font-size:14px;margin-top:8px}
.hero .facts{display:flex;gap:36px;margin-left:auto;align-items:flex-end}
.hero .facts div{font-size:13px;color:var(--ink3)}
.hero .facts b{display:block;font-size:24px;color:var(--ink);font-weight:600;line-height:1.15}
.go{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:11px 18px;font-size:14px;cursor:pointer;white-space:nowrap}
.go:hover{background:#2A3240}
.band{display:flex;height:34px;gap:2px;margin:14px 0 16px;flex:none}
.band button{border:0;padding:0;height:100%;cursor:pointer;min-width:3px;transition:filter .12s}
.band button:first-child{border-radius:5px 0 0 5px}.band button:last-child{border-radius:0 5px 5px 0}
.band button:hover{filter:brightness(.88)}
.cats{overflow:auto;min-height:0;flex:1}
.cats table{border:0;border-radius:0}
.cats td{padding:8px 6px;border-bottom:1px solid var(--rule)}
.cats tr{cursor:pointer}.cats tr.other{cursor:default}
.cats tr:hover:not(.other){background:var(--hover)}
.cats .nm{display:flex;align-items:center;gap:10px}.cats .nm i{width:10px;height:10px;border-radius:2px;flex:none}
.cats .share{width:38%}.cats .share span{display:block;height:6px;border-radius:3px}
.cats .r{text-align:right;color:var(--ink2);width:72px}.cats .pc{text-align:right;font-weight:600;width:56px}
.cats .note{color:var(--ink3);font-size:12px;white-space:normal}
.side-col{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:24px;min-height:0}
.flowstats{display:flex;gap:28px;margin:10px 0 6px}
.flowstats div{font-size:12px;color:var(--ink3)}
.flowstats b{display:block;font-size:19px;color:var(--ink);font-weight:600;line-height:1.2}
.chart{position:relative;flex:1;min-height:110px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 8px;border-radius:4px;white-space:nowrap;display:none;transform:translate(-50%,-115%)}
.note{font-size:12px;color:var(--ink3);margin-top:6px}
.trust{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.trust svg{flex:none;margin-top:2px}
.trust p{margin:0 0 8px}
.trust button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
.trust .nums{display:flex;gap:28px;margin:4px 0 10px}
.trust .nums div{font-size:12px;color:var(--ink3)}
.trust .nums b{display:block;font-size:19px;color:var(--ink);font-weight:600}

/* ---------- workspace ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 58px)}
aside.side{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;min-height:0;position:sticky;top:58px;height:calc(100vh - 58px)}
.side-h{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
.side-h h2{font:600 15px/1.3 var(--serif);margin:0}.side-h span{color:var(--ink3);font-size:12px}
.treefind{margin:0 16px 8px;border:1px solid var(--rule2);border-radius:6px;padding:6px 10px;background:var(--surface)}
.tree{overflow:auto;flex:1;padding:0 8px 16px}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px}.tree>ul{padding:0}
.node{display:grid;grid-template-columns:14px 10px 1fr auto;align-items:center;gap:4px;width:100%;border:0;background:none;text-align:left;padding:4px 8px 4px 2px;border-radius:5px;cursor:pointer}
.node:hover{background:var(--hover)}
.node[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.node .tw{color:var(--ink3);font-size:9px;text-align:center}
.node .sw{width:8px;height:8px;border-radius:2px}
.node .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n{color:var(--ink3);font-size:12px;font-weight:400;padding-left:8px}
.node .chg{font-size:11px;color:#8A5A00;margin-left:6px;font-weight:400}

main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:14px 28px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.scope{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:15px}
.scope button{border:0;background:none;padding:2px 5px;border-radius:4px;cursor:pointer;color:var(--accent)}
.scope button:hover{background:var(--accent-soft)}
.scope .sep{color:var(--ink3);padding:0 2px}
.scope .cur{font:600 16px var(--serif);padding:2px 5px}
.scope .cnt{color:var(--ink3);font-size:13px;margin-left:6px}
.scope .clear{color:var(--ink2);border:1px solid var(--rule2);margin-left:8px;font-size:12px;padding:2px 8px}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--ink2);border-radius:6px}
.tabs button:hover{background:var(--hover)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.on{display:flex}
.tools{display:flex;gap:10px;padding:16px 28px 10px;align-items:center;flex-wrap:wrap}
.tools input[type=search]{flex:1;max-width:440px;border:1px solid var(--rule2);border-radius:6px;padding:8px 12px;background:var(--surface)}
.tools select{border:1px solid var(--rule2);border-radius:6px;padding:7px 10px;background:var(--surface)}
.tools .hint{color:var(--ink3);font-size:12px;margin-left:auto}
kbd{font:11px var(--sans);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--ink2)}
.fresh{margin:0 28px 10px;padding:9px 14px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:0;text-align:left;cursor:pointer;display:none}
.fresh.on{display:block}
.tablewrap{padding:0 28px 28px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
tbody tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--ink3);font-size:12px;background:#FAFBFC}
td.num{color:var(--ink3);text-align:right}
td .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.muted{color:var(--ink3)}
.more{display:block;margin:14px auto 0;border:1px solid var(--rule2);background:var(--surface);border-radius:6px;padding:7px 18px;cursor:pointer}
.empty{padding:40px 4px;color:var(--ink2);max-width:560px}
.empty b{color:var(--ink);display:block;margin-bottom:6px;font-weight:600}
.empty code{background:var(--hover);padding:1px 6px;border-radius:4px;font-size:12px}

/* star plate */
.plate{height:560px;margin:0 28px 28px;position:relative;background:var(--plate);border-radius:8px;overflow:hidden}
.plate canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.plate .cap{position:absolute;left:16px;bottom:12px;color:var(--plate-ink);font-size:12px;opacity:.8;pointer-events:none}
.plate .tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border-radius:5px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;white-space:nowrap}

/* attrs */
.attrs{padding:4px 28px 28px}
.attrs .lead{color:var(--ink2);font-size:13px;margin:6px 0 14px;max-width:72ch}
.attrs td{white-space:normal}
.cov{display:inline-block;height:6px;background:var(--accent);border-radius:3px;vertical-align:middle;margin-right:8px}
.kinds span{display:inline-block;margin-right:8px;color:var(--ink2)}
.kinds span.drift{color:#8A5A00;font-weight:600}

/* log */
.log{padding:8px 28px 28px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-content:start}
.log h3{font:600 15px/1.3 var(--serif);margin:6px 0 10px}
.log ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.log li{padding:10px 14px;border-bottom:1px solid var(--rule);font-size:13px}.log li:last-child{border-bottom:0}
.log .rev{color:var(--ink3);display:inline-block;min-width:92px}
.log .why{color:#9A2B22}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--rule);transform:translateX(100%);visibility:hidden;transition:transform .18s ease-out,visibility 0s .18s;display:flex;flex-direction:column;z-index:10}
.drawer.on{transform:none;visibility:visible;transition:transform .18s ease-out;box-shadow:-10px 0 30px rgba(20,25,34,.10)}
.dh{padding:20px 22px 14px;border-bottom:1px solid var(--rule);position:relative}
.dh h2{font:600 20px/1.3 var(--serif);margin:0 0 6px;padding-right:36px}
.dh .x{position:absolute;top:16px;right:14px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink3);width:34px;height:34px;border-radius:6px}
.dh .x:hover{background:var(--hover)}
.db{overflow:auto;flex:1;padding:6px 22px 22px}
.kv{display:grid;grid-template-columns:150px 1fr;column-gap:14px;font-size:13px;margin:0}
.kv dt{color:var(--ink3);padding:7px 0;border-bottom:1px solid var(--rule);overflow:hidden;text-overflow:ellipsis}
.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--rule);word-break:break-word}
.db h3{font:600 14px/1.3 var(--serif);margin:20px 0 4px}
details{margin-top:18px}summary{cursor:pointer;color:var(--accent);font-size:13px}
pre{font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--paper);padding:12px;border-radius:6px;overflow:auto;white-space:pre-wrap;word-break:break-all}

@media (max-width:980px){
  .home{grid-template-columns:1fr;height:auto}.side-col{grid-template-rows:auto auto}.chart{min-height:160px}.big{font-size:42px}.hero .facts{margin-left:0}
  .shell{grid-template-columns:1fr}aside.side{position:static;max-height:300px;border-right:0;border-bottom:1px solid var(--rule)}
  .log{grid-template-columns:1fr}.tabs{margin-left:0}.tools .hint{display:none}
  .top{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px}.nav{height:40px}.top .run{margin-left:0}.top select{min-width:0}
}
</style>
</head>
<body>
<header class="top">
  <h1>宇宙万物观测站</h1>
  <nav class="nav" aria-label="页面"><a href="#/" data-p="home">总览</a><a href="#/explore" data-p="explore">浏览</a></nav>
  <span class="status"><span class="dot" id="dot"></span><span id="conn">正在连接</span></span>
  <label class="run">观测批次 <select id="run"></select></label>
</header>

<section class="page home" id="page-home" aria-label="总览">
  <div class="hero">
    <div class="headline"><div class="lbl">已入库对象</div><span class="big" id="big">–</span><div class="say" id="say"></div></div>
    <div class="facts" id="facts"></div>
    <button class="go" id="goExplore">浏览全部对象</button>
  </div>
  <div class="card">
    <h2>世界由什么构成 <span>按大类统计，点击一类即可进入浏览</span></h2>
    <div class="band" id="band"></div>
    <div class="cats"><table><tbody id="cats"></tbody></table></div>
  </div>
  <div class="side-col">
    <div class="card">
      <h2>数据流入 <span id="flowSpan"></span></h2>
      <div class="flowstats" id="flowStats"></div>
      <div class="chart" id="chart"><svg id="svg" aria-label="每秒入库对象数"></svg><div class="tt" id="tt"></div></div>
      <div class="note" id="flowNote"></div>
    </div>
    <div class="card"><h2>数据可信度</h2><div class="trust" id="trust"></div></div>
  </div>
</section>

<section class="page" id="page-explore" aria-label="浏览">
<div class="shell">
  <aside class="side" aria-label="分类树">
    <div class="side-h"><h2>分类</h2><span id="treeRev"></span></div>
    <input class="treefind" id="treeFind" type="search" placeholder="查找分类" aria-label="查找分类">
    <nav class="tree" id="tree"></nav>
  </aside>
  <main>
    <div class="bar">
      <div class="scope" id="scope"></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-v="list" aria-selected="true">对象</button>
        <button role="tab" data-v="map" aria-selected="false">星图</button>
        <button role="tab" data-v="attrs" aria-selected="false">字段结构</button>
        <button role="tab" data-v="log" aria-selected="false">变化记录</button>
      </div>
    </div>

    <section class="view on" id="v-list">
      <div class="tools">
        <input id="q" type="search" placeholder="搜索名称或 ID" aria-label="搜索对象">
        <select id="frame" aria-label="坐标系"><option value="">所有坐标系</option></select>
        <span class="hint"><kbd>/</kbd> 搜索　<kbd>↑</kbd><kbd>↓</kbd> 选择　<kbd>Enter</kbd> 打开　<kbd>Esc</kbd> 关闭</span>
      </div>
      <button class="fresh" id="fresh"></button>
      <div class="tablewrap">
        <table><thead><tr><th>名称</th><th>分类</th><th>坐标系</th><th>位置</th><th>观测时间</th><th style="text-align:right">序号</th></tr></thead><tbody id="rows"></tbody></table>
        <div id="listEmpty"></div>
        <button class="more" id="more" hidden>加载更早的 100 个</button>
      </div>
    </section>

    <section class="view" id="v-map">
      <div class="tools">
        <select id="mapFrame" aria-label="坐标系">
          <option value="galactic">银河坐标（光年）</option>
          <option value="stellar_system">恒星系坐标</option>
          <option value="local_surface">地表坐标（米）</option>
        </select>
        <span class="hint">悬停查看对象，点击打开详情；颜色与上方构成光谱一致</span>
      </div>
      <div class="plate" id="plate"><canvas id="map" aria-label="对象位置星图"></canvas><div class="cap" id="mapCap"></div><div class="tip" id="tip"></div></div>
    </section>

    <section class="view" id="v-attrs"><div class="attrs" id="attrs"></div></section>
    <section class="view" id="v-log"><div class="log" id="log"></div></section>
  </main>
</div>

</section>

<aside class="drawer" id="drawer" aria-label="对象详情" aria-hidden="true">
  <div class="dh"><h2 id="dTitle"></h2><div class="scope" id="dPath"></div><button class="x" id="dClose" aria-label="关闭详情">×</button></div>
  <div class="db" id="dBody"></div>
</aside>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'–':Number(n).toLocaleString('zh-CN');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qp=o=>Object.entries(o).filter(([,v])=>v!==null&&v!==''&&v!==undefined).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
async function j(u){const r=await fetch(u);if(!r.ok){let m=r.statusText;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}return r.json()}
const hhmm=t=>new Date(t*1000).toLocaleTimeString('zh-CN',{hour12:false});
const frameName=f=>({galactic:'银河坐标',stellar_system:'恒星系坐标',local_surface:'地表坐标',none:'无位置'}[f]||f);

/* Category colour follows the entity: top-level categories sorted by type_id get slots 1..7 in fixed order; the rest are "其他". */
const SLOTS=['--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
const PLATE=['#3987e5','#d95926','#199e70','#c98500','#d55181','#2fa52f','#9085e9'];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let CAT=new Map(); // top-level id -> {slot, name}
function colorOf(topId,plate){const c=CAT.get(topId);if(!c||c.slot<0)return plate?'#7D8A9C':css('--c-other');return plate?PLATE[c.slot]:css(SLOTS[c.slot])}

const S={tid:'',type:null,view:'list',before:null,sel:-1,open:new Set([1]),tree:null,nodes:new Map(),mapPts:[],seen:null,treeFilter:''};

/* ---------- runs ---------- */
async function loadRuns(){
  const runs=await j('/api/runs');const sel=$('#run');
  sel.innerHTML=runs.length?runs.map(r=>`<option value="${esc(r.test_id)}">${esc(r.test_id)}（${fmt(r.objects)} 个对象）</option>`).join(''):'<option value="">暂无数据</option>';
  if(!S.tid&&runs[0])S.tid=runs[0].test_id;sel.value=S.tid;return runs.find(r=>r.test_id===S.tid);
}
$('#run').onchange=e=>{S.tid=e.target.value;S.type=null;S.seen=null;closeDrawer();refreshAll()};

/* ---------- overview ---------- */
let lastOv=null;
async function overview(){
  const [o,r]=await Promise.all([j('/api/overview?'+qp({test_id:S.tid})),j('/api/rate?'+qp({test_id:S.tid,whole:1,points:240}))]);
  lastOv=o;const run=o.run||{};
  $('#big').textContent=fmt(run.objects);
  const tops=S.tree?S.tree.roots.flatMap(r=>r.children).length:0;
  $('#say').textContent=run.objects?`分布在 ${tops} 个大类、${fmt(o.server.types_known)} 个分类中`:'启动一轮发生器后，这里会实时更新';
  $('#facts').innerHTML=`<div><b>${fmt(run.batches)}</b>入库批次</div><div><b>${fmt(o.server.types_known)}</b>分类</div><div><b>${fmt(run.tree_revision)}</b>分类树修订</div><div><b>${fmt(Math.round(o.rate_10s))}</b>当前每秒入库</div>`;
  const live=o.rate_10s>0;
  $('#dot').className='dot '+(live?'on':'');

    <p>每一批都在写入磁盘后才向发生器确认。含缺字段或格式错误对象的批次整批拒收，不会有半批数据进入系统。</p><button id="toLog">查看拦截原因</button></div>`:'<p>收到数据后，这里会说明有多少批被去重、多少批因格式错误被拦截。</p>';

  const fs=$('#frame');if(fs.options.length<=1)Object.entries(o.frames).forEach(([f,n])=>fs.add(new Option(frameName(f)+'（'+fmt(n)+'）',f)));

}

/* area chart: objects stored per second across the whole run */
let FLOW=null;
function drawFlow(r,live,o){
  const pts=r.points;FLOW={pts,bucket:r.bucket};
  const vals=pts.map(p=>p[1]);const peak=Math.max(0,...vals);const active=vals.filter(v=>v>0);
  const avg=active.length?active.reduce((a,b)=>a+b,0)/active.length:0;
  const dur=r.start!=null?(r.end-r.start+1):0;
  $('#flowSpan').textContent=r.start!=null?`${hhmm(r.start)} – ${hhmm(r.end)}，共 ${dur>=120?Math.round(dur/60)+' 分钟':dur+' 秒'}`:'';
  $('#flowStats').innerHTML=`<div><b>${fmt(Math.round(o.rate_10s))}</b>当前（个/秒）</div><div><b>${fmt(Math.round(peak))}</b>峰值（个/秒）</div><div><b>${fmt(Math.round(avg))}</b>流入时平均（个/秒）</div>`;
  $('#flowNote').textContent=live?'曲线实时更新：纵轴为每秒入库对象数，横轴为时间。':(pts.length?'当前没有数据流入。曲线为本批次全程的入库速率，悬停可看每个时刻的数值。':'还没有数据。');
  const svg=$('#svg');if(!svg.clientWidth)return;const W=svg.clientWidth,H=svg.clientHeight||140;const L=44,R=8,T=8,B=22;
  if(!pts.length){svg.innerHTML='';return}
  const mx=niceMax(peak||1);const x=i=>L+(pts.length<2?0:i/(pts.length-1))*(W-L-R),y=v=>T+(1-v/mx)*(H-T-B);
  let d=`M${x(0)},${y(pts[0][1])}`;pts.forEach((p,i)=>{if(i)d+=`L${x(i)},${y(p[1])}`});
  const area=d+`L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const ticks=[0,mx/2,mx];const xt=[0,Math.floor((pts.length-1)/2),pts.length-1];
  svg.innerHTML=`${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#E2E5EA"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#7A8293">${fmtShort(t)}</text>`).join('')}
    ${xt.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="11" fill="#7A8293">${hhmm(pts[i][0])}</text>`).join('')}
    <path d="${area}" fill="#2a78d6" fill-opacity=".12"/><path d="${d}" fill="none" stroke="#1C5CAB" stroke-width="2" stroke-linejoin="round"/>
    <line id="xh" y1="${T}" y2="${H-B}" stroke="#141922" stroke-opacity=".35" visibility="hidden"/><circle id="xc" r="4" fill="#1C5CAB" stroke="#fff" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/>`;
  const hit=$('#hit'),tt=$('#tt');
  hit.onmousemove=e=>{const bx=svg.getBoundingClientRect();const i=Math.max(0,Math.min(pts.length-1,Math.round((e.clientX-bx.left-L)/(W-L-R)*(pts.length-1))));
    const X=x(i),Y=y(pts[i][1]);$('#xh').setAttribute('x1',X);$('#xh').setAttribute('x2',X);$('#xh').setAttribute('visibility','visible');
    $('#xc').setAttribute('cx',X);$('#xc').setAttribute('cy',Y);$('#xc').setAttribute('visibility','visible');
    tt.style.display='block';tt.style.left=X+'px';tt.style.top=Y+'px';tt.textContent=`${hhmm(pts[i][0])}　每秒 ${fmt(Math.round(pts[i][1]))} 个`};
  hit.onmouseleave=()=>{tt.style.display='none';$('#xh').setAttribute('visibility','hidden');$('#xc').setAttribute('visibility','hidden')};
}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
function fmtShort(v){return v>=10000?(v/10000).toFixed(v%10000?1:0)+' 万':fmt(Math.round(v))}

/* composition spectrum */
function renderSpectrum(){
  if(!S.tree)return;const root=S.tree.roots[0];const total=root?root.total:0;if(!total){$('#band').innerHTML='';$('#cats').innerHTML='';return}
  const tops=S.tree.roots.flatMap(r=>r.children).filter(p=>p.total>0).sort((a,b)=>b.total-a.total);
  const main=tops.filter(p=>CAT.get(p.id)&&CAT.get(p.id).slot>=0);
  const rest=tops.filter(p=>!(CAT.get(p.id)&&CAT.get(p.id).slot>=0));
  const restN=rest.reduce((a,p)=>a+p.total,0)+(root.own||0);
  const restNames=rest.map(p=>p.name).concat(root.own?['仅标为“万物”']:[]);
  const parts=main.map(p=>({id:p.id,name:p.name,total:p.total,color:colorOf(p.id)}));
  if(restN)parts.push({id:'',name:'其他',total:restN,color:css('--c-other'),note:restNames.join('、')});
  const curTop=S.type?topOf(S.type):null;const pc=v=>{const r=v/total*100;return (r<10?r.toFixed(1):Math.round(r))+'%'};
  $('#band').innerHTML=parts.map(p=>`<button style="flex:${p.total};background:${p.color}" data-id="${p.id}" title="${esc(p.name)}${p.note?'（'+esc(p.note)+'）':''}：${fmt(p.total)} 个，${pc(p.total)}"></button>`).join('');
  const mx=Math.max(...parts.map(p=>p.total));
  $('#cats').innerHTML=parts.map(p=>`<tr data-id="${p.id}" class="${p.id===''?'other':''}"><td><span class="nm"><i style="background:${p.color}"></i><span>${esc(p.name)}${p.note?`<div class="note">${esc(p.note)}</div>`:''}</span></span></td>
    <td class="share"><span style="width:${p.total/mx*100}%;background:${p.color}"></span></td><td class="r">${fmt(p.total)}</td><td class="pc">${pc(p.total)}</td></tr>`).join('');
}

/* ---------- tree ---------- */
function topOf(id){let n=S.nodes.get(id);while(n&&n.parentNode&&n.parentNode.parentNode)n=n.parentNode;return n&&n.parentNode?n.id:null}
async function tree(){
  const t=await j('/api/tree?'+qp({test_id:S.tid}));S.tree=t;S.nodes.clear();
  const changed=new Set(t.changes.map(c=>c[2]));
  (function walk(ns,parent){for(const n of ns){n.parentNode=parent;n.changed=changed.has(n.id);S.nodes.set(n.id,n);walk(n.children,n)}})(t.roots,null);
  const tops=t.roots.flatMap(r=>r.children).map(n=>n.id).sort((a,b)=>a-b);
  const bySize=t.roots.flatMap(r=>r.children).sort((a,b)=>b.total-a.total).map(n=>n.id);
  // the 7 largest categories get colours; slot order follows type_id so a colour never jumps when sizes change
  const coloured=new Set(bySize.slice(0,7));let k=0;CAT=new Map();
  for(const id of tops){CAT.set(id,{slot:coloured.has(id)?k++:-1})}
  $('#treeRev').textContent=t.revision?'第 '+t.revision+' 次修订':'';
  renderTree();renderScope();renderSpectrum();
}
function matches(n,f){return !f||n.name.toLowerCase().includes(f)||n.children.some(c=>matches(c,f))}
function renderTree(){
  const f=S.treeFilter.toLowerCase();
  const li=(n,depth)=>{if(!matches(n,f))return'';const has=n.children.length,open=f||S.open.has(n.id);
    const sw=depth===1?`<span class="sw" style="background:${colorOf(n.id)}"></span>`:'<span></span>';
    return `<li><button class="node" data-id="${n.id}" aria-current="${S.type===n.id}" ${has?`aria-expanded="${!!open}"`:''}>
      <span class="tw" data-tog="${n.id}">${has?(open?'▼':'▶'):''}</span>${sw}<span class="nm">${esc(n.name)}${n.changed?'<span class="chg">已变更</span>':''}</span><span class="n">${fmt(n.total)}</span></button>
      ${has&&open?'<ul>'+n.children.map(c=>li(c,depth+1)).join('')+'</ul>':''}</li>`};
  $('#tree').innerHTML=S.tree&&S.tree.roots.length?'<ul>'+S.tree.roots.map(r=>li(r,0)).join('')+'</ul>':'<div class="empty" style="padding:16px">分类树会在第一次分类修订到达后出现。</div>';
}
$('#tree').onclick=e=>{const n=e.target.closest('.node');if(!n)return;const id=+n.dataset.id;
  if(e.target.closest('[data-tog]')&&S.nodes.get(id).children.length){S.open.has(id)?S.open.delete(id):S.open.add(id);renderTree();return}
  setType(S.type===id?null:id)};
$('#treeFind').oninput=e=>{S.treeFilter=e.target.value.trim();renderTree()};
function setType(id){S.type=id;let p=S.nodes.get(id);while(p){S.open.add(p.id);p=p.parentNode}renderTree();renderScope();renderSpectrum();reloadView()}
function pathOf(id){const out=[];let p=S.nodes.get(id);while(p){out.unshift(p);p=p.parentNode}return out}
function renderScope(){
  const el=$('#scope');
  if(!S.type){el.innerHTML=`<span class="cur">全部对象</span>`;return}
  const p=pathOf(S.type);
  el.innerHTML=p.map((n,i)=>i===p.length-1?`<span class="cur">${esc(n.name)}</span>`:`<button data-id="${n.id}">${esc(n.name)}</button><span class="sep">/</span>`).join('')+
    `<span class="cnt">含子类共 ${fmt(p[p.length-1].total)} 个</span><button class="clear" data-id="">清除筛选</button>`;

$('#mapFrame').onchange=map;
async function map(){
  const fk=$('#mapFrame').value;const d=await j('/api/map?'+qp({test_id:S.tid,frame_kind:fk,limit:8000}));
  const c=$('#map'),x=c.getContext('2d'),dpr=devicePixelRatio||1;const W=c.width=c.clientWidth*dpr,H=c.height=c.clientHeight*dpr;
  x.clearRect(0,0,W,H);x.strokeStyle='rgba(216,228,240,.07)';x.lineWidth=1;
  for(let i=1;i<12;i++){x.beginPath();x.moveTo(W*i/12,0);x.lineTo(W*i/12,H);x.stroke()}for(let i=1;i<8;i++){x.beginPath();x.moveTo(0,H*i/8);x.lineTo(W,H*i/8);x.stroke()}
  S.mapPts=[];
  let pts=d.points;if(S.type){const ids=new Set();(function w(n){ids.add(n.id);n.children.forEach(w)})(S.nodes.get(S.type));pts=pts.filter(p=>ids.has(p[2]))}
  if(!pts.length){$('#mapCap').textContent=S.type?'当前分类在这个坐标系里没有对象，换一个坐标系试试，或清除筛选':'这个坐标系里还没有对象';return}
  const q=(a,f)=>{const s=[...a].sort((m,n)=>m-n);return s[Math.floor(f*(s.length-1))]};
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=q(xs,.01),x1=q(xs,.99),y0=q(ys,.01),y1=q(ys,.99);
  const pad=28*dpr,r=1.7*dpr;
  for(const p of pts){const X=pad+(p[0]-x0)/((x1-x0)||1)*(W-2*pad),Y=H-pad-(p[1]-y0)/((y1-y0)||1)*(H-2*pad);
    x.globalAlpha=.9;x.fillStyle=colorOf(topOf(p[2])??p[2],true);x.beginPath();x.arc(X,Y,r,0,7);x.fill();S.mapPts.push([X,Y,p[3],(S.nodes.get(p[2])||{}).name])}
  x.globalAlpha=1;
  $('#mapCap').textContent=`${frameName(fk)}：最近 ${fmt(pts.length)} 个对象的平面投影（x / y），两端各 1% 的离群点不在视野内`;
}
function nearest(e){const c=$('#map'),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1,X=(e.clientX-r.left)*dpr,Y=(e.clientY-r.top)*dpr;
  let b=null,bd=1e18;for(const p of S.mapPts){const dd=(p[0]-X)**2+(p[1]-Y)**2;if(dd<bd){bd=dd;b=p}}return bd<(10*dpr)**2?b:null}

/* ---------- views, keys, refresh ---------- */
function switchView(v){S.view=v;document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('on',el.id==='v-'+v));reloadView()}
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>switchView(b.dataset.v));
function reloadView(){const f={list:()=>list(false),map,attrs,log}[S.view];f().catch(e=>toastErr(e.message))}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return}
  if(e.target.matches('input,select'))return;
  if(e.key==='/'){e.preventDefault();go('explore');switchView('list');$('#q').focus();return}
  if(S.page!=='explore'||S.view!=='list')return;
  if(e.key==='ArrowDown'){e.preventDefault();selectRow(S.sel+1)}
  if(e.key==='ArrowUp'){e.preventDefault();selectRow(S.sel-1)}
  if(e.key==='Enter'&&S.sel>=0)openObj($('#rows').children[S.sel].dataset.id);
});
window.addEventListener('resize',()=>{if(lastOv&&FLOW)overview()});
function toastErr(m){$('#dot').className='dot err';$('#conn').textContent=m}
async function refreshAll(){try{await loadRuns();if(!S.tid){list(false);renderTree();return}await tree();await overview();if(S.page==='explore')reloadView()}catch(e){toastErr('无法连接服务：'+e.message)}}
async function tick(){try{await loadRuns();if(S.tid)await overview()}catch(e){toastErr('与服务的连接中断，正在重试')}}
route();refreshAll();setInterval(tick,2000);
setInterval(()=>{if(S.tid)tree().then(()=>{if(S.view==='log')log()}).catch(()=>{})},6000);
</script>
</body>
</html>
